<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waves — Growth Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --navy: #233954;
    --aqua: #2AD2C9;
    --aqua-light: #e0faf9;
    --gray: #D9D9D6;
    --white: #FFFFFF;
    --text-primary: #233954;
    --text-secondary: #6b7a8d;
    --text-muted: #a0aab4;
    --surface: #f7f8fa;
    --border: rgba(35,57,84,0.1);
    --li-color: #0A66C2;
    --ig-color: #E1306C;
    --yt-color: #FF0000;
    --em-color: #2AD2C9;
    --up: #0F6E56;
    --down: #A32D2D;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--surface);
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--navy);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--aqua);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-mark svg { width: 18px; height: 18px; }
  .logo-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--white);
    letter-spacing: 0.02em;
  }
  .logo-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .period-select {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: var(--white);
    cursor: pointer;
    outline: none;
  }
  .period-select option { background: var(--navy); color: var(--white); }
  .btn-refresh {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--aqua);
    color: var(--navy);
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s;
  }
  .btn-refresh:hover { opacity: 0.85; }
  .btn-refresh.loading { opacity: 0.6; pointer-events: none; }
  .last-update {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    font-family: 'DM Mono', monospace;
  }

  /* MAIN */
  .main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .status-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--white);
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .status-chip.connected .status-dot { background: var(--up); }
  .status-chip.error .status-dot { background: var(--down); animation: pulse 1.5s infinite; }
  .status-chip.loading .status-dot { background: #f0a500; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* KPI GLOBAL */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  .kpi-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .kpi-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 24px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }
  .kpi-delta {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .kpi-delta.up { color: var(--up); }
  .kpi-delta.down { color: var(--down); }

  /* CHANNEL CARDS */
  .channels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }
  @media (max-width: 800px) { .channels-grid { grid-template-columns: 1fr; } }

  .channel-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .channel-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .channel-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .channel-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .channel-icon svg { width: 18px; height: 18px; }
  .channel-name { font-size: 15px; font-weight: 500; }
  .channel-handle { font-size: 12px; color: var(--text-muted); }
  .channel-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 500;
  }

  .channel-metrics {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
  }
  .ch-metric {
    padding: 14px 12px;
    border-right: 1px solid var(--border);
    text-align: center;
  }
  .ch-metric:last-child { border-right: none; }
  .ch-metric-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
  }
  .ch-metric-val {
    font-size: 15px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    color: var(--text-primary);
  }
  .ch-metric-delta {
    font-size: 11px;
    margin-top: 2px;
  }

  .channel-chart {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
  }
  .chart-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .chart-wrap { position: relative; height: 100px; }

  /* ERROR STATE */
  .error-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    gap: 8px;
  }
  .error-state .icon { font-size: 24px; }
  .error-state p { font-size: 13px; color: var(--text-secondary); }
  .error-state code {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: #fff3f3;
    color: var(--down);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .config-link {
    font-size: 12px;
    color: var(--aqua);
    text-decoration: none;
    font-weight: 500;
  }

  /* SPINNER */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(35,57,84,0.2);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TABLA CAMPAÑAS MAILING */
  .mailing-table-wrap {
    padding: 0 0 4px;
    border-top: 1px solid var(--border);
    overflow-x: auto;
  }
  .mailing-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .mailing-table thead tr {
    border-bottom: 1px solid var(--border);
  }
  .mailing-table th {
    padding: 8px 12px;
    text-align: left;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    white-space: nowrap;
  }
  .mailing-table th.num { text-align: right; }
  .mailing-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    white-space: nowrap;
  }
  .mailing-table td.num { text-align: right; font-family: 'DM Mono', monospace; font-size: 12px; }
  .mailing-table tr:last-child td { border-bottom: none; }
  .mailing-table tr:hover td { background: var(--surface); }
  .rate-pill {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
  }
  .rate-high  { background: #e8f8f5; color: #0F6E56; }
  .rate-mid   { background: #fff8e1; color: #a07000; }
  .rate-low   { background: #fdf0ee; color: #A32D2D; }

</style>
</head>

<script>

// ============================================================
// UTILIDADES
// ============================================================

function fmtNum(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.round(n).toLocaleString('es-AR');
}

function fmtDelta(current, prev) {
  if (!prev || prev === 0) return null;
  const pct = ((current - prev) / prev) * 100;
  return { pct: pct.toFixed(1), up: pct >= 0 };
}

function deltaHtml(d) {
  if (!d) return '';
  const arrow = d.up ? '↑' : '↓';
  const cls = d.up ? 'up' : 'down';
  return `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(d.pct)}%</span>`;
}

function deltaSmall(d) {
  if (!d) return '';
  const arrow = d.up ? '↑' : '↓';
  const cls = d.up ? 'color:var(--up)' : 'color:var(--down)';
  return `<span style="font-size:11px;${cls}">${arrow}${Math.abs(d.pct)}%</span>`;
}

function days() { return parseInt(document.getElementById('periodSel').value); }

function now() {
  return new Date().toLocaleString('es-AR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
}

// ============================================================
// ESTADO GLOBAL
// ============================================================
let state = {
  linkedin:  { status: 'loading', data: null },
  instagram: { status: 'loading', data: null },
  youtube:   { status: 'ok', data: null },
  odoo:      { status: 'loading', data: null },
  ga4:       { status: 'ok', data: null },
};

let charts = {};

// ============================================================
// LINKEDIN API
// ============================================================
async function fetchLinkedIn() {
  // Datos estáticos — período 26/4 al 25/5/2026
  return {
    impressions: 16218,
    engagement:  263,
    seguidores:  11245,
    clicks:      263,
    leads:       0,
    history:     [800, 950, 2600, 2100, 600, 400, 200, 180],
  };
  const { accessToken, organizationId } = CONFIG.linkedin;
  if (!accessToken || accessToken.includes('PEGAR')) throw new Error('Token no configurado');

  const d = days();
  const end = Date.now();
  const start = end - d * 86400000;

  const headers = { 'Authorization': `Bearer ${accessToken}`, 'X-Restli-Protocol-Version': '2.0.0' };

  // Followers
  const flRes = await fetch(
    `https://api.linkedin.com/v2/organizationalEntityFollowerStatistics?q=organizationalEntity&organizationalEntity=urn:li:organization:${organizationId}`,
    { headers }
  );
  if (!flRes.ok) throw new Error(`LinkedIn ${flRes.status}`);
  const flData = await flRes.json();
  const followers = flData.elements?.[0]?.followerCountsByAssociationType?.find(x => x.associationType === 'MEMBER')?.followerCounts?.organicFollowerCount || 0;

  // Share stats
  const shRes = await fetch(
    `https://api.linkedin.com/v2/organizationalEntityShareStatistics?q=organizationalEntity&organizationalEntity=urn:li:organization:${organizationId}&timeIntervals.timeGranularityType=DAY&timeIntervals.startTime=${start}&timeIntervals.endTime=${end}`,
    { headers }
  );
  const shData = shRes.ok ? await shRes.json() : { elements: [] };

  let impressions = 0, clicks = 0, reactions = 0, comments = 0, shares = 0;
  (shData.elements || []).forEach(e => {
    const s = e.totalShareStatistics || {};
    impressions += s.impressionCount || 0;
    clicks      += s.clickCount || 0;
    reactions   += s.likeCount || 0;
    comments    += s.commentCount || 0;
    shares      += s.shareCount || 0;
  });

  // History para gráfico (últimos 6 periodos de impressions por día)
  const history = (shData.elements || []).slice(-6).map(e => e.totalShareStatistics?.impressionCount || 0);

  return { followers, impressions, clicks, engagement: reactions + comments + shares, leads: clicks, history };
}

// ============================================================
// INSTAGRAM API (Meta Graph API)
// ============================================================
async function fetchInstagram() {
  // Datos estáticos — semana 17/5 al 23/5/2026
  return {
    impressions: 288,
    engagement:  45,
    seguidores:  900,
    clicks:      0,
    leads:       0,
    history:     [40, 55, 38, 72, 60, 48, 288],
  };
  const { accessToken, accountId } = CONFIG.instagram;
  if (!accessToken || accessToken.includes('PEGAR')) throw new Error('Token no configurado');

  const period = days() <= 7 ? 'week' : 'days_28';

  // Insights
  const insRes = await fetch(
    `https://graph.facebook.com/v19.0/${accountId}/insights?metric=impressions,reach,profile_views,website_clicks,follower_count&period=${period}&access_token=${accessToken}`
  );
  if (!insRes.ok) throw new Error(`Instagram ${insRes.status}`);
  const insData = await insRes.json();

  const getVal = (name) => {
    const m = insData.data?.find(x => x.name === name);
    return m?.values?.reduce((a, v) => a + (v.value || 0), 0) || 0;
  };

  // Media engagement
  const mediaRes = await fetch(
    `https://graph.facebook.com/v19.0/${accountId}/media?fields=like_count,comments_count,timestamp&limit=20&access_token=${accessToken}`
  );
  const mediaData = mediaRes.ok ? await mediaRes.json() : { data: [] };
  let likes = 0, comments = 0;
  (mediaData.data || []).forEach(m => { likes += m.like_count || 0; comments += m.comments_count || 0; });

  // Followers total
  const profRes = await fetch(
    `https://graph.facebook.com/v19.0/${accountId}?fields=followers_count&access_token=${accessToken}`
  );
  const profData = profRes.ok ? await profRes.json() : {};

  const history = (mediaData.data || []).slice(0,6).reverse().map(m => m.like_count || 0);

  return {
    impressions: getVal('impressions'),
    engagement: likes + comments,
    seguidores: profData.followers_count || 0,
    clicks: getVal('website_clicks'),
    leads: getVal('website_clicks'),
    history
  };
}

// ============================================================
// YOUTUBE ANALYTICS API
// ============================================================
async function fetchYouTube() {
  const { accessToken, channelId } = CONFIG.youtube;
  if (!accessToken || accessToken.includes('PEGAR')) throw new Error('Token no configurado');

  const end = new Date().toISOString().split('T')[0];
  const start = new Date(Date.now() - days() * 86400000).toISOString().split('T')[0];

  const ytRes = await fetch(
    `https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==${channelId}&startDate=${start}&endDate=${end}&metrics=views,estimatedMinutesWatched,likes,comments,subscribersGained&dimensions=day&access_token=${accessToken}`
  );
  if (!ytRes.ok) throw new Error(`YouTube ${ytRes.status}`);
  const ytData = await ytRes.json();

  let views = 0, likes = 0, comments = 0, subs = 0;
  const history = [];
  (ytData.rows || []).forEach(row => {
    views    += row[1] || 0;
    likes    += row[3] || 0;
    comments += row[4] || 0;
    subs     += row[5] || 0;
    history.push(row[1] || 0);
  });

  // Subscriber total
  const chRes = await fetch(
    `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&access_token=${accessToken}`
  );
  const chData = chRes.ok ? await chRes.json() : {};
  const totalSubs = parseInt(chData.items?.[0]?.statistics?.subscriberCount || 0);

  return {
    impressions: views,
    engagement: likes + comments,
    seguidores: totalSubs,
    clicks: views,
    leads: subs,
    history: history.slice(-6)
  };
}

// ============================================================
// MAILING — Lee Google Sheet publicado como CSV
// ============================================================
async function fetchOdoo() {
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTk9Q6uAiRaPAirxjzkafJ545lMVnrII6OV-RS1Ws51b8TEeElvwb7OGTCKwlyIU-Zs3N4NbNKxxVmX/pub?gid=0&single=true&output=csv';

  const res = await fetch(SHEET_URL);
  if (!res.ok) throw new Error('No se pudo leer el Sheet de Mailing');
  const text = await res.text();

  function splitLine(line) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  }

  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('Sheet vacío');

  const headers = splitLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = splitLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (cols[idx] || '').trim(); });
    if (obj['Estado'] === 'Enviado') rows.push(obj);
  }

  if (!rows.length) throw new Error('Sin campañas enviadas en el Sheet');

  const d = days();
  const since = new Date(Date.now() - d * 86400000);
  const inPeriod = rows.filter(r => {
    const fecha = r['Fecha de importación'] || r['Fecha de envío'] || '';
    if (!fecha) return true;
    return new Date(fecha) >= since;
  });

  const data = inPeriod.length > 0 ? inPeriod : rows;

  let sent = 0, clicked = 0, sumApertura = 0, sumEntrega = 0;
  const history = [];

  data.forEach(r => {
    const enviado  = parseInt(r['Enviado']) || 0;
    const clics    = parseFloat(r['Número de clics']) || 0;
    const apertura = parseFloat(r['Tasa de apertura (%)'] || r['Tasa de apertura']) || 0;
    const entrega  = parseFloat(r['Tasa de entrega (%)'] || r['Proporción de correos recibidos']) || 0;
    sent        += enviado;
    clicked     += clics;
    sumApertura += apertura;
    sumEntrega  += entrega;
    history.push(Math.round(enviado * apertura / 100));
  });

  const avgApertura = data.length > 0 ? (sumApertura / data.length) : 0;
  const avgEntrega  = data.length > 0 ? (sumEntrega  / data.length) : 0;
  const opened      = Math.round(sent * avgApertura / 100);

  return {
    impressions:  sent,
    engagement:   opened,
    seguidores:   rows.length,
    clicks:       Math.round(clicked),
    leads:        Math.round(clicked),
    openRate:     avgApertura.toFixed(1),
    deliveryRate: avgEntrega.toFixed(1),
    campaigns:    data.length,
    history:      history.slice(-6),
    rawRows:      data,
  };
}

// ============================================================
// GOOGLE ANALYTICS 4 DATA API
// ============================================================
async function fetchGA4() {
  const { propertyId, serviceAccountKey } = CONFIG.ga4;
  if (!serviceAccountKey || !serviceAccountKey.private_key) throw new Error('GA4 no configurado');

  // Obtener access token via JWT (service account)
  async function getGoogleToken(sa) {
    const now = Math.floor(Date.now() / 1000);
    const header = btoa(JSON.stringify({ alg: 'RS256', typ: 'JWT' })).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const claim = btoa(JSON.stringify({
      iss: sa.client_email,
      scope: 'https://www.googleapis.com/auth/analytics.readonly',
      aud: 'https://oauth2.googleapis.com/token',
      exp: now + 3600,
      iat: now
    })).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');

    // Importar clave privada
    const pemBody = sa.private_key.replace(/-----[^-]+-----/g,'').replace(/\s/g,'');
    const keyData = Uint8Array.from(atob(pemBody), c => c.charCodeAt(0));
    const cryptoKey = await crypto.subtle.importKey(
      'pkcs8', keyData.buffer,
      { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
      false, ['sign']
    );

    const toSign = new TextEncoder().encode(`${header}.${claim}`);
    const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', cryptoKey, toSign);
    const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const jwt = `${header}.${claim}.${sigB64}`;

    const tokenRes = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`
    });
    const tokenData = await tokenRes.json();
    if (!tokenData.access_token) throw new Error('No se pudo obtener token GA4');
    return tokenData.access_token;
  }

  const token = await getGoogleToken(serviceAccountKey);
  const d = days();
  const startDate = `${d}daysAgo`;

  const body = {
    dateRanges: [{ startDate, endDate: 'today' }],
    metrics: [
      { name: 'sessions' },
      { name: 'screenPageViews' },
      { name: 'totalUsers' },
      { name: 'outboundClicks' },
      { name: 'conversions' }
    ],
    dimensions: [{ name: 'date' }],
    orderBys: [{ dimension: { dimensionName: 'date' } }]
  };

  const res = await fetch(
    `https://analyticsdata.googleapis.com/v1beta/properties/${propertyId}:runReport`,
    {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }
  );
  if (!res.ok) throw new Error(`GA4 ${res.status}`);
  const data = await res.json();

  let sessions = 0, pageviews = 0, users = 0, outbound = 0, conversions = 0;
  const history = [];
  (data.rows || []).forEach(row => {
    const s = parseInt(row.metricValues[0].value || 0);
    sessions    += s;
    pageviews   += parseInt(row.metricValues[1].value || 0);
    users       += parseInt(row.metricValues[2].value || 0);
    outbound    += parseInt(row.metricValues[3].value || 0);
    conversions += parseInt(row.metricValues[4].value || 0);
    history.push(s);
  });

  return {
    impressions: sessions,
    engagement: pageviews,
    seguidores: users,
    clicks: outbound,
    leads: conversions,
    history: history.slice(-6)
  };
}

// ── Tabla de campañas Mailing ──
function mailingTableHtml(rows) {
  function rateClass(v) {
    const n = parseFloat(v);
    if (n >= 50) return 'rate-high';
    if (n >= 20) return 'rate-mid';
    return 'rate-low';
  }
  function pct(v) {
    const n = parseFloat(v);
    return isNaN(n) ? '—' : n.toFixed(1) + '%';
  }
  const sorted = [...rows].sort((a, b) => {
    const da = new Date(a['Fecha de importación'] || a['Fecha de envío'] || 0);
    const db = new Date(b['Fecha de importación'] || b['Fecha de envío'] || 0);
    return db - da;
  });
  const trs = sorted.map(r => {
    const asunto  = (r['Asunto'] || '—').length > 45 ? (r['Asunto'] || '').substring(0, 43) + '…' : (r['Asunto'] || '—');
    const fecha   = r['Fecha de importación'] || r['Fecha de envío'] || '—';
    const enviado = parseInt(r['Enviado']) || 0;
    const clics   = parseFloat(r['Número de clics']) || 0;
    const apertura = parseFloat(r['Tasa de apertura (%)'] || r['Tasa de apertura']) || 0;
    const entrega  = parseFloat(r['Tasa de entrega (%)'] || r['Proporción de correos recibidos']) || 0;
    return `<tr>
      <td title="${r['Asunto'] || ''}">${asunto}</td>
      <td>${fecha}</td>
      <td class="num">${enviado.toLocaleString('es-AR')}</td>
      <td class="num"><span class="rate-pill ${rateClass(entrega)}">${pct(entrega)}</span></td>
      <td class="num"><span class="rate-pill ${rateClass(apertura)}">${pct(apertura)}</span></td>
      <td class="num">${Math.round(clics)}</td>
    </tr>`;
  }).join('');
  return `<div class="mailing-table-wrap">
    <table class="mailing-table">
      <thead><tr>
        <th>Campaña</th>
        <th>Fecha</th>
        <th class="num">Enviados</th>
        <th class="num">Entrega</th>
        <th class="num">Apertura</th>
        <th class="num">Clics</th>
      </tr></thead>
      <tbody>${trs}</tbody>
    </table>
  </div>`;
}

async function loadAll() {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('loading');
  document.getElementById('refreshIcon').innerHTML = '<span class="spinner"></span>';

  CHANNELS_DEF.forEach(ch => { state[ch.id].status = 'loading'; });
  renderStatus();

  const fetchers = {
    linkedin:  fetchLinkedIn,
    instagram: fetchInstagram,
    youtube:   async () => ({ impressions:0, engagement:0, seguidores:0, clicks:0, leads:0, history:[] }), // Looker Studio embed
    odoo:      fetchOdoo,
    ga4:       async () => ({ impressions:0, engagement:0, seguidores:0, clicks:0, leads:0, history:[] }), // Looker Studio embed
  };

  await Promise.allSettled(
    CHANNELS_DEF.map(async ch => {
      try {
        const data = await fetchers[ch.id]();
        state[ch.id] = { status: 'ok', data };
      } catch (e) {
        console.warn(`[${ch.label}]`, e.message);
        state[ch.id] = { status: 'error', data: null, error: e.message };
      }
    })
  );

  renderStatus();
  renderKPIs();
  renderChannels();

  btn.classList.remove('loading');
  document.getElementById('refreshIcon').textContent = '↻';
  document.getElementById('lastUpdate').textContent = 'Actualizado: ' + now();
}
